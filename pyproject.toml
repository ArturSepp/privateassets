[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privateassets"
version = "0.6.2"
description = "Multi-factor money-weighted PME for private-asset cash flows: risk-adjusted alpha and factor exposures"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Artur Sepp", email = "artursepp@gmail.com" }]
keywords = [
    "private equity", "private credit", "private assets", "PME",
    "direct alpha", "money-weighted returns", "unsmoothing", "cash flows",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.11",
    "qis>=5.2.1",
]

[project.optional-dependencies]
# Sign-constrained shrinkage betas. factorlasso is GPL-3: see the licence note in
# README.md before redistributing a combined work.
factors = ["factorlasso>=0.10.0"]
excel = ["openpyxl>=3.1"]
plot = ["matplotlib>=3.8"]
docs = ["furo>=2024.8.6", "sphinx>=8.0"]

[dependency-groups]
test = ["pytest>=8.0", "openpyxl>=3.1"]
lint = ["ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ArturSepp/privateassets"
Documentation = "https://privateassets.readthedocs.io"
Repository = "https://github.com/ArturSepp/privateassets"
Issues = "https://github.com/ArturSepp/privateassets/issues"
Changelog = "https://github.com/ArturSepp/privateassets/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["privateassets*"]
exclude = ["privateassets.run*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# "I" is not selected anywhere in this stack: the import grouping convention puts
# the scientific stack before the project packages, which isort reorders.
select = ["E", "F", "W"]
extend-select = ["TID251", "TID253", "ICN"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# A1: privateassets depends on qis and optionally factorlasso, and on nothing else in the stack.
"optimalportfolios".msg = "A1: subject packages never import each other."
"trendfollowing".msg = "A1: subject packages never import each other."
"stochvolmodels".msg = "A1: subject packages never import each other."
"goal_based_allocation".msg = "A1: subject packages never import each other."
"vanilla_option_pricers".msg = "A1: subject packages never import each other."

[tool.ruff.lint.flake8-tidy-imports]
# A3: optional libraries stay behind guarded local imports, never package import time.
banned-module-level-imports = [
    "yfinance",
    "pandas_datareader",
    "pybloqs",
    "plotly",
    "pyarrow",
    "psycopg2",
    "sqlalchemy",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
# This replaces Ruff's default alias map; only numpy and pandas use house aliases.
numpy = "np"
pandas = "pd"
