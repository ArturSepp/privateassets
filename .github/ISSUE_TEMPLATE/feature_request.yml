name: Feature request
description: Propose a focused addition within PrivateAssets' analytics boundary.
title: "[Feature]: "
body:
  - type: textarea
    id: research_task
    attributes:
      label: Research or user task
      description: Describe the task before proposing an API.
    validations:
      required: true
  - type: textarea
    id: current_gap
    attributes:
      label: Current limitation
      description: Explain why the public API and existing stack packages do not already handle it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include timing, frequency, annualisation, return, and missing-data conventions.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Cash-flow and NAV handling
        - PME or deflator
        - Factor exposure
        - Inference or unsmoothing
        - Documentation or example
        - Packaging or developer tooling
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundary
      options:
        - label: This does not require committing or redistributing proprietary or licensed data.
          required: true
        - label: I considered whether the functionality belongs in qis, factorlasso, or optimalportfolios.
          required: true
